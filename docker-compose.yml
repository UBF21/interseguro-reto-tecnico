services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: interseguro_auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - '${HOST_PORT_POSTGRES:-5532}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root-token-local-dev-only}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - '${HOST_PORT_VAULT:-8300}:8200'
    healthcheck:
      test: ['CMD', 'vault', 'status']
      interval: 5s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root-token-local-dev-only}
      JWT_SECRET: ${JWT_SECRET:-CAMBIAR-este-valor-antes-de-cualquier-uso-real-min-32-bytes}
    volumes:
      - ./infra/vault/seed-secrets.sh:/seed-secrets.sh:ro
    entrypoint: ['sh', '/seed-secrets.sh']
    restart: 'no'

  api-auth:
    build: ./api-auth
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      # Swagger UI ("/", ver README) solo se sirve en Development -- nunca en un despliegue real.
      ASPNETCORE_ENVIRONMENT: ${REPO_ENV:-development}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root-token-local-dev-only}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=interseguro_auth;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      WebOrigin: http://localhost:${HOST_PORT_WEB:-5273}
    ports:
      - '${HOST_PORT_API_AUTH:-5100}:8080'

  api-endosos:
    build: ./api-endosos
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      # Swagger UI ("/", ver README) solo se sirve fuera de "production" -- nunca en un despliegue real.
      NODE_ENV: ${REPO_ENV:-development}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root-token-local-dev-only}
      PORT: 3001
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/interseguro_endosos
      WEB_ORIGIN: http://localhost:${HOST_PORT_WEB:-5273}
    ports:
      - '${HOST_PORT_API_ENDOSOS:-3101}:3001'

  api-rutas:
    build: ./api-rutas
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      # Swagger UI ("/", ver README) solo se sirve fuera de "production" -- nunca en un despliegue real.
      APP_ENV: ${REPO_ENV:-development}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root-token-local-dev-only}
      PORT: 8080
      WEB_ORIGIN: http://localhost:${HOST_PORT_WEB:-5273}
    ports:
      - '${HOST_PORT_API_RUTAS:-8180}:8080'

  web:
    build:
      context: ./web
      args:
        VITE_AUTH_API_URL: http://localhost:${HOST_PORT_API_AUTH:-5100}
        VITE_ENDOSOS_API_URL: http://localhost:${HOST_PORT_API_ENDOSOS:-3101}
        VITE_RUTAS_API_URL: http://localhost:${HOST_PORT_API_RUTAS:-8180}
    ports:
      - '${HOST_PORT_WEB:-5273}:80'

volumes:
  postgres-data:
